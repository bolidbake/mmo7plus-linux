[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mmo7-config"
version = "1.1.0"
description = "Native Linux PyQt6 configurator for the Mad Catz M.M.O. 7+ gaming mouse (wireless dongle & USB wired)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PyQt6>=6.4.0",
]

[project.gui-scripts]
mmo7-config = "mmo7:main"

[tool.setuptools.packages.find]
include = ["mmo7*"]

[tool.setuptools.package-data]
mmo7 = ["assets/*.png"]
